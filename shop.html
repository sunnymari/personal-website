<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop | Mari Summers</title>
  <meta name="description" content="Shop Mari Summers merch: hats, tees, and tops." />
  <link href="/style.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script type="module" src="/src/global-cursor.js"></script>
  <style>
    .shop-hero { text-align: center; padding: 1rem 0 0.5rem; white-space: normal; overflow: visible; }
    .shop-hero h1 { font-family: 'Fredoka', 'Nunito', sans-serif; margin-bottom: 0.4rem; }
    .shop-bow { font-size: 3.2rem; display: inline-block; animation: shop-wiggle 2.4s ease-in-out infinite; }
    @keyframes shop-wiggle { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
    .shop-sub { white-space: normal; color: var(--island-plum); font-weight: 700; font-size: 1.1rem; margin: 0 auto 1.6rem; max-width: 520px; }
    .shop-cats { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin: 0 auto 2rem; }
    .shop-cat {
      background: var(--island-cream-light); border: 2px solid var(--island-pink-border);
      border-radius: 22px; padding: 1.1rem 1.4rem; min-width: 140px; text-align: center;
      box-shadow: 0 6px 0 var(--island-pink-soft);
    }
    .shop-cat span { font-size: 2.2rem; display: block; }
    .shop-cat b { font-family: 'Fredoka', 'Nunito', sans-serif; color: var(--island-berry); font-size: 1.1rem; }
    .container a.shop-btn, .shop-btn {
      display: inline-block; background: linear-gradient(180deg, #ef5da8 0%, #b45e89 100%);
      color: #fff !important; text-decoration: none !important; font-family: 'Fredoka', 'Nunito', sans-serif;
      font-size: 1.25rem; font-weight: 700; padding: 0.95rem 2.4rem; border-radius: 999px;
      box-shadow: 0 6px 0 #8f5f79; transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .container a.shop-btn:hover, .shop-btn:hover { color: #fff; transform: translateY(3px); box-shadow: 0 3px 0 #8f5f79; }
    .shop-note { color: var(--island-plum); font-size: 0.95rem; margin-top: 1.2rem; }
  </style>
</head>
<body class="site-page">
  <nav class="nav-buttons" style="margin-top: 1.5rem;">
    <a href="/" class="nav-link"><span class="nav-cloud-wrap"><span class="nav-cloud-text">Home</span></span></a>
    <a href="/about" class="nav-link"><span class="nav-cloud-wrap"><span class="nav-cloud-text">About</span></span></a>
    <a href="/projects" class="nav-link"><span class="nav-cloud-wrap"><span class="nav-cloud-text">Projects</span></span></a>
    <a href="/growth" class="nav-link"><span class="nav-cloud-wrap"><span class="nav-cloud-text">Growth</span></span></a>
    <a href="/lock-in" class="nav-link"><span class="nav-cloud-wrap"><span class="nav-cloud-text">Lock-In</span></span></a>
    <a href="/dream-companies" class="nav-link"><span class="nav-cloud-wrap"><span class="nav-cloud-text">Company</span></span></a>
    <a href="/reading" class="nav-link"><span class="nav-cloud-wrap"><span class="nav-cloud-text">Reading</span></span></a>
    <a href="/blog" class="nav-link"><span class="nav-cloud-wrap"><span class="nav-cloud-text">Blog</span></span></a>
    <a href="/modeling" class="nav-link"><span class="nav-cloud-wrap"><span class="nav-cloud-text">Modeling</span></span></a>
    <a href="/art" class="nav-link"><span class="nav-cloud-wrap"><span class="nav-cloud-text">Art</span></span></a>
    <a href="/shop" class="nav-link"><span class="nav-cloud-wrap"><span class="nav-cloud-text">Shop</span></span></a>
    <a href="/sprout" class="nav-link"><span class="nav-cloud-wrap"><span class="nav-cloud-text">Sprout</span></span></a>
    <a href="https://logonlogoff.vercel.app" class="nav-link" target="_blank" rel="noopener noreferrer"><span class="nav-cloud-wrap"><span class="nav-cloud-text">Log On Log Off</span></span></a>
  </nav>

  <div class="container">
    <div class="shop-hero">
      <div class="shop-bow" aria-hidden="true">🎀</div>
      <h1>Mari Summers Shop</h1>
      <p class="shop-sub">Cute merch made with love ♡ Hats, tees, and tops for networking girlies and cozy days alike.</p>
    </div>

    <div class="shop-cats">
      <div class="shop-cat"><span aria-hidden="true">🧢</span><b>Hats</b></div>
      <div class="shop-cat"><span aria-hidden="true">👕</span><b>Tees</b></div>
      <div class="shop-cat"><span aria-hidden="true">🌸</span><b>Tops</b></div>
    </div>

    <div style="text-align: center;">
      <a class="shop-btn" href="https://www.marisummers.store/" target="_blank" rel="noopener noreferrer">✿ Visit my store ✿</a>
      <p class="shop-note">Opens marisummers.store in a new tab.</p>
    </div>
  </div>
</body>
</html>
